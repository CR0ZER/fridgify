# Fridgify — sert la PWA compilee et relaie l'API vers FastAPI.
# Installe par deploy/install.sh vers /etc/nginx/sites-available/fridgify.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/fridgify;
    index index.html;

    # Une photo de ticket compressee pese ~300 Ko ; la marge couvre les envois
    # bruts si la compression cote navigateur echoue.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;

    # Ces trois fichiers pilotent les mises a jour de la PWA : mis en cache, ils
    # figeraient l'application sur une version ancienne apres chaque deploiement.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Importe par sw.js : mis en cache, il figerait le comportement des
    # notifications sur une version ancienne.
    location = /push-handler.js {
        add_header Cache-Control "no-cache" always;
    }

    # Les noms de fichiers construits par Vite contiennent une empreinte : leur
    # contenu ne change jamais, on peut donc les cacher indefiniment.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        # Ajoute le header X-API-Key. Le fichier est genere par install.sh et
        # n'est lisible que par root : le secret ne descend jamais au navigateur.
        include snippets/fridgify-api-key.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Le protocole vu par le navigateur, pas celui vu par nginx : c'est
        # tailscaled qui termine le TLS puis relaie ici en clair. L'API s'en
        # sert pour marquer le cookie de session « HTTPS uniquement ». Vide en
        # acces direct sur le reseau local, nginx omet alors l'en-tete.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Un scan de ticket demande a Gemini une
        # trentaine de secondes : le defaut de 60 s serait trop juste en cas de
        # ralentissement.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Toutes les routes de l'application sont rendues cote client : ce qui n'est
    # pas un fichier reel doit retomber sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
